<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spam Email Detection</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #f4f7fb; color: #172033; }
    main { max-width: 820px; margin: 0 auto; padding: 56px 20px; }
    .card { background: white; border-radius: 18px; padding: 32px; box-shadow: 0 10px 35px #17203316; }
    h1 { margin-top: 0; font-size: 2.2rem; }
    p { line-height: 1.6; color: #536176; }
    textarea { width: 100%; box-sizing: border-box; min-height: 190px; padding: 16px; border: 1px solid #d8dfeb; border-radius: 12px; resize: vertical; font: inherit; }
    button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 10px; background: #315efb; color: white; font-weight: 700; cursor: pointer; }
    .result { margin-top: 24px; padding: 18px; border-radius: 12px; background: #edf7ef; border-left: 5px solid #2f9e44; }
    .result.spam { background: #fff0f0; border-left-color: #d63939; }
    .error { margin-top: 20px; color: #b42318; }
    .label { font-size: 1.3rem; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Spam Email Detection</h1>
      <p>Paste an email message below. The trained machine-learning model will classify it as spam or ham.</p>
      <form method="post">
        <textarea name="email_text" placeholder="Paste email text here...">{{ email_text }}</textarea>
        <button type="submit">Check Email</button>
      </form>
      {% if result %}
      <div class="result {{ 'spam' if result.label == 'spam' else '' }}">
        <div class="label">{{ result.label|upper }}</div>
        <div>Confidence: {{ '%.2f'|format(result.confidence * 100) }}%</div>
      </div>
      {% endif %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </section>
  </main>
</body>
</html>
